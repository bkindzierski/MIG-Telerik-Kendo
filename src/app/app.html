 <div class="header"> 
  <!-- <img src="https://secure.merchantsgroup.com:84/images/migmnuproc/agents_r2_c1.jpg">   -->
  <!-- <img src="https://secure.merchantsgroup.com:84/images/migmnuproc/agents_r1_c1.jpg">  -->

    <div class="nav-container">
      <!-- <img src="https://secure.merchantsgroup.com:84/images/migmnuproc/agents_r2_c1.jpg">  -->
      <img src="agents_r2_c1_SM.jpg">
      <div class="menu-button">
        <button
          kendoButton
          [svgIcon]="menuIcon"
          fillMode="flat"
          (click)="drawer.toggle()">
        </button>
        <!-- <kendo-svg-icon [icon]="menuIcon" size="xlarge"></kendo-svg-icon> -->
      </div>
      <div class="title">
        <h2> Merchants Insurance Group</h2>
      </div>
      <div class="menuDropdown">
        <span>Resouces/Tools</span>
        <kendo-combobox
            [data]="listItems"
            [allowCustom]="allowCustom"
            [(ngModel)]="selectedValues">
         </kendo-combobox>
      </div>
    </div>
 </div>
 <div class="migdrawer">
  <kendo-drawer-container>
        <kendo-drawer
          #drawer
          [items]="items"
          mode="push"
          [mini]="false"
          [expanded]="true"
          (expandedChange)="onExpandedChange($event)"
          (select)="onSelect($event)">
        </kendo-drawer>
        <kendo-drawer-content>
          <router-outlet/>
          <!-- <my-content [selectedItem]="selected"></my-content> -->
        </kendo-drawer-content>
</kendo-drawer-container>
</div>
