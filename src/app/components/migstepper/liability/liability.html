<!-- <p>liability works!</p> -->
 <ng-container [formGroup]="liabilityDetails">
    <kendo-formfield>
        <kendo-label [for]="fullName" text="Full Name"></kendo-label>
        <kendo-textbox
            formControlName="fullName"
            #fullName
            [clearButton]="true">
        </kendo-textbox>
        <kendo-formerror>Full Name is required</kendo-formerror>
    </kendo-formfield>

    <kendo-formfield showHints="initial" showErrors="initial">
        <kendo-label [for]="country" text="Country"></kendo-label>
        <kendo-autocomplete
            #country
            [data]="countries"
            formControlName="country">
        </kendo-autocomplete>

        <kendo-formhint>European countries</kendo-formhint>

        @if (!liabilityDetails.controls.country.errors?.required) {
            <kendo-formerror>Country is required</kendo-formerror>
        }
    </kendo-formfield>

    <kendo-formfield orientation="horizontal" showHints="initial">
        <label class="k-label">Gender</label>

        <ul class="k-radio-list k-list-horizontal">
            <li class="k-radio-item">
            <input
                type="radio"
                #male
                value="male"
                kendoRadioButton
                formControlName="gender"/>
            <kendo-label
                class="k-radio-label"
                [for]="male"
                text="Male">
            </kendo-label>
            </li>

            <li class="k-radio-item">
            <input
                type="radio"
                #female
                value="female"
                kendoRadioButton
                formControlName="gender"/>
            <kendo-label
                class="k-radio-label"
                [for]="female"
                text="Female">
            </kendo-label>
            </li>

            <li class="k-radio-item">
            <input
                type="radio"
                #other
                value="other"
                kendoRadioButton
                formControlName="gender" />
            <kendo-label
                class="k-radio-label"
                [for]="other"
                text="Other">
            </kendo-label>
            </li>
        </ul>
        <kendo-formerror>This field is required</kendo-formerror>
    </kendo-formfield>

    <kendo-formfield>
        <kendo-label [for]="about" text="About" [optional]="true"></kendo-label>
        <kendo-textarea
            #about
            formControlName="about"
            placeholder="Who you are...">
        </kendo-textarea>
    </kendo-formfield>

</ng-container>
